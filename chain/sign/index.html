<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>OXAR - подпись обновления программы</title>
    <style>
      body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #17171a; background: #fbfbf9; }
      label { display: block; margin: 14px 0 4px; color: #666; font-size: 13px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; font: 13px ui-monospace, monospace; }
      button { margin: 18px 10px 0 0; padding: 12px 22px; border: 0; border-radius: 999px; background: #17171a; color: #fff; font: inherit; cursor: pointer; }
      button.light { background: #e9e9e4; color: #17171a; }
      button:disabled { opacity: 0.35; cursor: default; }
      pre { white-space: pre-wrap; background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 14px; font: 12.5px/1.6 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Обновление программы OXAR</h1>
    <p>
      Сначала «Проверить»: страница сверит права с сетью и прогонит транзакцию вхолостую.
      Подписывать - только если всё сошлось и видно, сколько SOL вернётся на кошелёк.
      Сеть в Phantom должна совпадать с сетью ниже.
    </p>
    <label>Нода (RPC)</label>
    <input id="rpc" value="https://api.devnet.solana.com" />
    <label>Программа</label>
    <input id="program" value="4zBp61iGL7f9zybTfrtwydUZmM2WxRsskedqFNdHiDpe" />
    <label>Буфер с новой версией</label>
    <input id="buffer" placeholder="адрес буфера" />
    <button id="check" class="light">Проверить</button>
    <button id="sign" disabled>Подписать в Phantom</button>
    <pre id="report">Подключи Phantom и нажми «Проверить».</pre>
    <pre id="result"></pre>
    <script src="dist/upgrade.js"></script>
  </body>
</html>
