[package]
name = "oxar-escrow"
version = "0.1.0"
description = "OXAR escrow: money is released for the time a placement actually stood"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oxar_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.2"
anchor-spl = "0.32.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
