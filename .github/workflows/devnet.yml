name: Devnet

# Тестовый стенд: тот же сайт, что на проде, но на devnet и со своей базой
# oxar-test. Там можно сколько угодно раз пройти весь путь - заявка продавца,
# торг, ставки, пруф, выплата - на тестовых деньгах и бесплатном газе, не
# трогая боевую базу и витрину.
#
# Выкатывается вслед за продом с каждого пуша в main, чтобы стенд не отставал
# от кода. Адрес - oxar-test.pages.dev.
#
# Здесь только сайт. Схему и функции базы oxar-test отсюда не выкатить: ключ
# Supabase в секретах выдан на проект oxar и к oxar-test доступа не имеет.
# Их накатывают руками той же командой, что и прод (supabase db push и
# functions deploy с --project-ref ijcfazillqigywcjwpac).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devnet
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_REF: ijcfazillqigywcjwpac
  TEST_URL: https://ijcfazillqigywcjwpac.supabase.co

jobs:
  stand:
    name: stand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Сеть не задана - значит devnet: так решено в lib/chain.ts, и так
      # стенд не может случайно уйти в боевую сеть.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Проверить, что сборка смотрит в тестовую базу
        run: |
          grep -rq "$TEST_REF" apps/app/out/_next/static || { echo "в сборке нет адреса тестовой базы"; exit 1; }

      - name: Завести проект стенда, если его нет
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages project create oxar-test --production-branch=main || true

      - name: Сайт -> oxar-test.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy apps/app/out
          --project-name=oxar-test --branch=main --commit-dirty=true
