name: Chain

# Программа на Solana проверяется отдельным прогоном, а не вместе с сайтом.
#
# Причина простая: установка Rust, Solana CLI и Anchor занимает минуты, а
# меняется программа редко. Вешать это на каждый пуш значило бы платить за
# правку текста на лендинге временем сборки компилятора.
#
# Поэтому прогон запускается только когда тронут сам chain/.

on:
  push:
    branches: [main]
    paths: ["chain/**", ".github/workflows/chain.yml"]
  pull_request:
    paths: ["chain/**", ".github/workflows/chain.yml"]

concurrency:
  group: chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версии закреплены ровно те, на которых программа собрана и развёрнута
      # на devnet. Anchor ломает совместимость между минорными версиями, и
      # «latest» однажды молча собрал бы другую программу под тем же адресом.
      - name: Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustc --version
          cargo --version

      # Через rustup run, а не просто cargo: на раннере есть свой cargo 1.84,
      # который перебивает поставленный выше и падает на edition2024.
      - name: Anchor
        run: |
          rustup run 1.89.0 cargo install \
            --git https://github.com/solana-foundation/anchor avm --force
          avm install 0.32.2
          avm use 0.32.2
          anchor --version

      # Solana ставится ПОСЛЕ Anchor, и порядок тут - не вкусовщина.
      #
      # avm тянет за собой свою Solana - ту, на которую закреплён anchor 0.32.2,
      # то есть 2.3.0 с platform-tools v1.48 и rustc 1.84. Она приезжает в тот
      # же каталог и перетирает поставленную нами. Прошлый прогон падал именно
      # на этом: по пути 3.1.10 лежал build-sbf 2.3.0, который не знает
      # --install-only, - и это было видно только потому, что шаг печатает
      # версию. Ставим свою последней, чтобы победила она.
      - name: Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Свой install, без воркспейса: у программы мир зависимостей другой -
      # web3.js первой версии и mocha, - и общий lockfile сводил бы их с
      # версиями приложения без нужды.
      - name: Зависимости тестов
        working-directory: chain
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Кошелёк для тестов
        run: solana-keygen new --no-bip39-passphrase --silent --force

      # Версия platform-tools закреплена явно.
      #
      # Без этого CI ставил старый набор с cargo 1.84, и сборка падала на
      # зависимости, требующей edition2024, - при том что та же сборка на
      # машине проходила. Расхождение было только в этом: локально приезжал
      # v1.52 с Rust 1.89, в CI - старее.
      #
      # Зовём по полному пути, а не через `cargo build-sbf`. Короткая форма в
      # CI находила чужой одноимённый бинарь - тот не знает `--install-only` и
      # ронял шаг, хотя у поставленной здесь версии этот ключ есть. Заодно
      # печатаем, что нашлось на пути: в следующий раз причина будет в логе,
      # а не в догадках.
      - name: Platform-tools
        run: |
          which -a cargo-build-sbf || true
          sbf="$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf"
          "$sbf" --version
          "$sbf" --tools-version v1.52 --install-only

      # Всё, что зовёт cargo, идёт через `rustup run 1.89.0`, и это не
      # перестраховка.
      #
      # На раннере свой cargo 1.84 стоит в пути раньше поставленного нами, а
      # `rustup default` его не перебивает - это отдельный бинарь, а не шим.
      # Саму программу собирает cargo из platform-tools, и она собиралась; но
      # сразу за ней anchor строит IDL обычным cargo, и вот он падал на
      # зависимости с edition2024. Снаружи это выглядело как «не собирается
      # программа», хотя программа к тому моменту уже была собрана.
      #
      # Версии печатаются: если наборы снова разъедутся, это будет видно в
      # логе, а не выясняться заново.
      - name: Сборка
        working-directory: chain
        run: |
          solana --version
          cargo-build-sbf --version
          rustup run 1.89.0 anchor build

      # Арифметика: сколько натекло продавцу, сколько вернётся покупателю,
      # сколько комиссии. Считается в целых, и переполнение здесь дороже всего.
      - name: Юнит-тесты арифметики
        working-directory: chain
        run: rustup run 1.89.0 cargo test --manifest-path programs/oxar-escrow/Cargo.toml

      # Против настоящего валидатора: возврат перебитому, продление торга,
      # запрет закрыть идущий торг и прочее, что на чистой арифметике не видно.
      - name: Интеграционные тесты
        working-directory: chain
        run: rustup run 1.89.0 anchor test --skip-build
