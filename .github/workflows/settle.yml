# Будильник торгов.
#
# В цепи таймеров нет: когда срок вышел, выплату и закрытие должен позвать
# кто-то снаружи. Этот кто-то - расписание. Скрипт смотрит в базу, есть ли
# закончившиеся неразобранные торги, и разбирает каждый: состоявшиеся -
# выплатой, несостоявшиеся - закрытием; заодно ставит напоминания в очередь
# уведомлений.
#
# Расписание GitHub на «раз в десять минут» не годится: 3 октября 2026 между
# запусками проходило по три-четыре часа (12:29, 16:39, 19:28 UTC), и
# напоминание «торг кончается через час» не успело уйти вовсе. Поэтому один
# запуск крутит разбор сам, раз в две минуты, почти шесть часов - потолок
# задачи на GitHub, - а расписание лишь подхватывает смену. Пока идёт смена,
# следующий запуск по расписанию ждёт в очереди и стартует сразу за ней.
#
# Запуск руками (workflow_dispatch) делает один проход и в очереди не ждёт:
# у него своя группа. Если он совпадёт с проходом смены, второй из них
# получит отказ программы на уже разобранном месте - цепь не даёт заплатить
# дважды, - и в базу ляжет итог первого.
#
# Ключ в секрете SETTLE_KEYPAIR - операционный кошелёк площадки. Увести
# деньги торгов им нельзя: получатели вморожены при открытии. Худшее при
# утечке - потратятся операционные SOL.
name: Settle

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: settle-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Версию pnpm экшен читает из корневого package.json - у chain своего
      # поля packageManager нет, и с указанием на него первый запуск упал.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chain/pnpm-lock.yaml

      - name: Зависимости
        working-directory: chain
        # --ignore-workspace обязателен, как в chain.yml: без него pnpm видит
        # корневой воркспейс, ставит его и не ставит сам chain - «ts-node not
        # found» на следующем шаге.
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Разбор просроченных торгов
        working-directory: chain
        env:
          SOLANA_RPC: ${{ secrets.SETTLE_RPC }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SETTLE_KEYPAIR: ${{ secrets.SETTLE_KEYPAIR }}
          KEYPAIR_PATH: /tmp/settle-keypair.json
          # Смена по расписанию - 340 минут, руками - один проход.
          SHIFT_MINUTES: ${{ github.event_name == 'schedule' && '340' || '0' }}
        run: |
          printf '%s' "$SETTLE_KEYPAIR" > /tmp/settle-keypair.json
          trap 'rm -f /tmp/settle-keypair.json' EXIT
          end=$((SECONDS + SHIFT_MINUTES * 60))
          failed=0
          while :; do
            echo "::group::проход $(date -u +%H:%M:%S)"
            pnpm exec ts-node --compilerOptions '{"module":"commonjs"}' scripts/settle-due.ts || failed=1
            echo "::endgroup::"
            [ "$SECONDS" -ge "$end" ] && break
            sleep 120
          done
          # Упавший проход не рвёт смену - следующий повторит, - но прогон
          # краснеет, чтобы это было видно.
          exit $failed
