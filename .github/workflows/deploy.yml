name: Deploy

# Приложения - статика: серверного кода в них нет, данные берутся из браузера.
# Поэтому сборка идёт здесь, а на Cloudflare Pages уезжает уже готовый каталог.
#
# Такой деплой (direct upload) не расходует месячную квоту сборок Pages - её
# тратят только проекты, которые Cloudflare собирает у себя из Git. Прежний
# путь через Vercel упирался в сто деплоев в сутки и на этом останавливал работу.
#
# PR по-прежнему только проверяется: тесты и сборка.
#
# Шаг деплоя выключен: кодовая база снесена под аукцион, собирать пока нечего.
# Включить обратно двумя проектами Pages, когда появятся приложения:
#   apps/web -> oxar.app       (лендинг и игра)
#   apps/app -> app.oxar.app   (аукцион)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию берём из поля packageManager в package.json —
      # если задать её и здесь, action падает на конфликте версий.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  deploy:
    # Выключено до появления apps/web и apps/app. Условие оставлено целиком,
    # чтобы вернуть шаг снятием одного false, а не сборкой заново.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Ключи публичные - они и так уезжают в браузер, - но в статику их
      # вписывает сборка, поэтому без них сайт остался бы без данных.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Wrangler стоит в зависимостях с точной версией, а не тянется из сети на
      # каждый деплой: в этом шаге есть токен Cloudflare, и подменённый пакет
      # исполнился бы с ним. Хэш пакета проверяется по lockfile.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy apps/landing/out
          --project-name=oxar-landing --branch=main --commit-dirty=true
