name: Deploy

# Репозиторий приватный и принадлежит организации, поэтому встроенная
# Git-интеграция Vercel на Hobby недоступна. Собираем здесь и отправляем
# в Vercel готовую сборку через `vercel deploy --prebuilt`.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Сборка выполняет код из ветки (postinstall-скрипты, next build) и при этом
    # видит VERCEL_TOKEN. Для PR из форков это чужой код — такие PR не деплоим.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: landing
            dir: apps/landing
            project_id_secret: VERCEL_PROJECT_ID_LANDING
          - name: app
            dir: apps/app
            project_id_secret: VERCEL_PROJECT_ID_APP
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      # CLI читает токен отсюда — в аргументах командной строки он был бы виден
      # в списке процессов раннера и мог утечь в логи.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # Версию берём из поля packageManager в package.json —
      # если задать её и здесь, action падает на конфликте версий.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: |
          TARGET=$([ "$IS_PROD" = "true" ] && echo production || echo preview)
          vercel pull --yes --environment="$TARGET" --cwd "${{ matrix.dir }}"

      - name: Build
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel build --prod --cwd "${{ matrix.dir }}"
          else
            vercel build --cwd "${{ matrix.dir }}"
          fi

      # Сборка уже лежит в .vercel/output. Дерево node_modules от pnpm состоит
      # из симлинков в корневой store — при загрузке CLI идёт по ним наружу
      # рабочей папки и падает. Для prebuilt-деплоя оно больше не нужно.
      - name: Drop node_modules before upload
        run: rm -rf "${{ matrix.dir }}/node_modules"

      - name: Deploy
        id: deploy
        run: |
          if [ "$IS_PROD" = "true" ]; then
            URL=$(vercel deploy --prebuilt --prod --cwd "${{ matrix.dir }}")
          else
            URL=$(vercel deploy --prebuilt --cwd "${{ matrix.dir }}")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          APP_NAME: ${{ matrix.name }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const name = process.env.APP_NAME;
            const url = process.env.PREVIEW_URL;
            const marker = `<!-- preview-${name} -->`;
            const body = `${marker}\n**${name}** preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
