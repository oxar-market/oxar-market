name: Deploy

# Репозиторий приватный и принадлежит организации, поэтому встроенная
# Git-интеграция Vercel на Hobby недоступна. Собираем здесь и отправляем
# в Vercel готовую сборку через `vercel deploy --prebuilt`.
#
# На бесплатном плане Vercel разрешает сто деплоев в сутки. Пара приложений на
# каждый PR плюс прод съедали этот лимит за день работы, и прогоны начинали
# падать не из-за кода. Поэтому PR только проверяется — тесты и сборка, — а
# деплоится лишь то, что попало в main.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию берём из поля packageManager в package.json —
      # если задать её и здесь, action падает на конфликте версий.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: landing
            project_id_secret: VERCEL_PROJECT_ID_LANDING
          - name: app
            project_id_secret: VERCEL_PROJECT_ID_APP
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      # CLI читает токен отсюда — в аргументах командной строки он был бы виден
      # в списке процессов раннера и мог утечь в логи.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        run: vercel deploy --prebuilt --prod
