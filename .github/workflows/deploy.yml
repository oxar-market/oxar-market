name: Deploy

# Приложения - статика: серверного кода в них нет, данные берутся из браузера.
# Поэтому сборка идёт здесь, а на Cloudflare Pages уезжает уже готовый каталог.
#
# Такой деплой (direct upload) не расходует месячную квоту сборок Pages - её
# тратят только проекты, которые Cloudflare собирает у себя из Git. Прежний
# путь через Vercel упирался в сто деплоев в сутки и на этом останавливал работу.
#
# PR по-прежнему только проверяется: тесты и сборка.
#
# Проектов Pages два, по одному на домен:
#   apps/web -> oxar.app       (лендинг)
#   apps/app -> app.oxar.app   (приложение)
#
# Оба уезжают одним прогоном, без разбора, что именно изменилось. Загрузка
# готового каталога занимает секунды, а условная логика «деплоить только
# изменившееся» стоила бы дороже, чем экономит.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию берём из поля packageManager в package.json —
      # если задать её и здесь, action падает на конфликте версий.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Не просто «прогон зелёный», а «тесты действительно были».
      #
      # Какое-то время pnpm test был пустышкой: задача в turbo.json стояла, а
      # скрипта test не было ни в одном пакете - turbo находил ноль задач и
      # зеленел. Этот же шаг стоял здесь, то есть проверка ничего не проверяла.
      - name: Тесты, и они обязаны быть
        run: |
          pnpm test 2>&1 | tee /tmp/test.log
          # Без привязки к префиксу пакета: turbo печатает его в терминале,
          # но не в CI, и проверка ловила бы собственный формат вывода, а не
          # факт прогона.
          grep -qE '# pass [1-9]' /tmp/test.log \
            || { echo "ни одного пройденного теста - прогон снова пустышка"; exit 1; }
          grep -qE '# fail 0' /tmp/test.log \
            || { echo "есть упавшие тесты"; exit 1; }

      - run: pnpm build

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Ключи публичные - они и так уезжают в браузер, - но в статику их
      # вписывает сборка, поэтому без них приложение осталось бы без входа и
      # без данных. Лендингу из них не нужно ничего, он статика целиком.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}

      # Сборка без ключей собирается молча и уезжает в прод мёртвой: у Privy
      # нет приложения, у Supabase нет адреса. Лучше упасть здесь.
      - name: Проверить, что ключи доехали в сборку
        run: |
          test -f apps/app/out/index.html || { echo "нет сборки приложения"; exit 1; }
          test -f apps/web/out/index.html || { echo "нет сборки лендинга"; exit 1; }
          grep -rq "${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}" apps/app/out/_next/static \
            || { echo "в сборке приложения нет app id Privy"; exit 1; }

      # Проект под приложение заводится сам, если его ещё нет: иначе первый
      # деплой требовал бы похода в дашборд, а забытый шаг выглядел бы как
      # поломка деплоя. Команда падает, если проект уже есть, - это и есть
      # обычный случай, поэтому её отказ не считается ошибкой. Если же проект
      # действительно не удалось создать, следующий шаг упадёт громко.
      - name: Завести проект приложения, если его нет
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages project create oxar-app
          --production-branch=main || true

      # Wrangler стоит в зависимостях с точной версией, а не тянется из сети на
      # каждый деплой: в этом шаге есть токен Cloudflare, и подменённый пакет
      # исполнился бы с ним. Хэш пакета проверяется по lockfile.
      - name: Лендинг -> oxar.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy apps/web/out
          --project-name=oxar-landing --branch=main --commit-dirty=true

      - name: Приложение -> app.oxar.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy apps/app/out
          --project-name=oxar-app --branch=main --commit-dirty=true

      # Вторая половина продукта живёт в Supabase, и она не уезжала вовсе.
      #
      # Так мы уже обожглись: фронт выкатился и работал, вход проходил, а мост
      # до базы падал - потому что ни таблицы, ни функции на проде не было.
      # Снаружи это выглядело как поломка входа, хотя код был верный.
      #
      # Пока это делалось руками, «забыл выкатить» оставалось возможным. Здесь
      # оно становится невозможным.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Схема меняется только миграциями. Push применяет те, которых на проде
      # ещё нет, и ничего не трогает сверх этого.
      #
      # Пароль от базы не нужен: CLI поднимает временную роль по токену.
      # Проверено с закрытым вводом - будь пароль нужен, команда упала бы на
      # запросе, а не прошла молча.
      - name: Схема -> Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref islmypspqjxuhplcibam
          supabase db push

      # Секреты функций ставятся перед выкаткой: функция, поднявшаяся без
      # PRIVY_APP_ID, принимала бы токены чужих приложений.
      - name: Секреты функций -> Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase secrets set
          PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          --project-ref islmypspqjxuhplcibam

      - name: Функции -> Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy privy-session
          --project-ref islmypspqjxuhplcibam

      # Проверка после выкатки, а не «должно работать»: функция обязана
      # отбивать запрос без токена и запрос с поддельным. Если она отвечает
      # иначе, значит уехала не та версия или не поднялись секреты.
      - name: Проверить, что мост жив
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          fn="$URL/functions/v1/privy-session"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$fn" -H "Authorization: Bearer $ANON")
          test "$code" = "401" || { echo "без токена ожидали 401, получили $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$fn" -H "Authorization: Bearer $ANON" -H 'X-Privy-Token: не.настоящий')
          test "$code" = "401" || { echo "с поддельным токеном ожидали 401, получили $code"; exit 1; }
          # Предзапрос CORS. Заголовок X-Privy-Token нестандартный, поэтому
          # браузер шлёт OPTIONS первым и без разрешения до POST не доходит.
          # Локально не видно: тамошний шлюз подставляет CORS сам.
          ok=$(curl -s -D- -o /dev/null -X OPTIONS "$fn" \
            -H 'Origin: https://app.oxar.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-privy-token' \
            | grep -ci 'access-control-allow-origin: https://app.oxar.app' || true)
          test "$ok" = "1" || { echo "предзапрос CORS не разрешён - браузер до функции не дойдёт"; exit 1; }
          echo "мост отвечает, отбивает чужое и пускает наш домен"
